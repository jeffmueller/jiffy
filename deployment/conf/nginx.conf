# Jiffy - jiffy.fsrvr.com
# Next.js standalone behind nginx with rate limiting

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=jiffy_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=jiffy_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=jiffy_proxy:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=jiffy_assets:10m rate=100r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=jiffy_perip:10m;

# Upstream for Next.js
upstream jiffy_backend {
    server 127.0.0.1:3003;
    keepalive 16;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name jiffy.fsrvr.com;

    access_log off;
    error_log /var/log/nginx/jiffy-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name jiffy.fsrvr.com;

    access_log off;
    error_log /var/log/nginx/jiffy-error.log warn;

    # SSL certs from certbot — inline settings to avoid dhparam duplicate from options-ssl-nginx.conf
    ssl_certificate /etc/letsencrypt/live/jiffy.fsrvr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiffy.fsrvr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # Connection limits
    limit_conn jiffy_perip 15;

    # Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    client_max_body_size 1M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block non-standard methods
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Block common vulnerability scans
    location ~* /(wp-admin|wp-login|wp-content|wordpress|xmlrpc\.php|phpmyadmin|pma) {
        deny all;
        return 444;
    }

    location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
        deny all;
        return 444;
    }

    location ~* (\.bak|\.backup|\.old|\.env|\.git|\.svn|\.sql)$ {
        deny all;
        return 444;
    }

    # Image proxy — stricter rate limit to prevent abuse
    location /api/proxy-image {
        limit_req zone=jiffy_proxy burst=10 nodelay;
        proxy_pass http://jiffy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API routes with rate limiting
    location /api {
        limit_req zone=jiffy_api burst=20 nodelay;
        proxy_pass http://jiffy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static assets — long cache, high rate limit
    location /_next/static {
        limit_req zone=jiffy_assets burst=50 nodelay;
        proxy_pass http://jiffy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /favicon.ico {
        proxy_pass http://jiffy_backend;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Everything else — Next.js
    location / {
        limit_req zone=jiffy_general burst=50 nodelay;
        proxy_pass http://jiffy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
